<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: system-ui, -apple-system, sans-serif;
      color: #e2e8f0;
    }

    .header {
      padding: 16px;
      background: rgba(14, 165, 233, 0.1);
      border-bottom: 1px solid rgba(14, 165, 233, 0.2);
    }

    h1 {
      font-size: 16px;
      color: #0ea5e9;
      margin-bottom: 4px;
    }

    p {
      font-size: 12px;
      color: #64748b;
    }

    #status {
      padding: 14px 16px;
      color: #ef4444;
      font-weight: 700;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #status.active {
      color: #10b981;
    }

    .divider {
      height: 1px;
      background: rgba(14, 165, 233, 0.1);
      margin: 0 16px;
    }

    button {
      display: block;
      width: calc(100% - 32px);
      margin: 12px 16px;
      padding: 12px;
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #334155;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎮 Agarz Pro v2</h1>
    <p>Akıllı Virus Kasma</p>
  </div>
  <div id="status">⚠ Agarz Açık Değil</div>
  <div class="divider"></div>
  <button id="open">▶ Paneli Aç</button>
  <div class="footer">v2.0.0 — agarz.com</div>
  <script src="popup.js"></script>
</body>
</html>
